[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastauth"
version = "0.1.0"
description = "A modern, pluggable authentication framework for FastAPI — batteries included."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "FastAuth Contributors" },
]
keywords = [
    "fastapi",
    "authentication",
    "jwt",
    "oauth2",
    "security",
    "login",
    "register",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19.0",
]
argon2 = [
    "argon2-cffi>=21.3.0",
]
all = [
    "fastauth[sqlalchemy,argon2]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.0",
    "coverage[toml]>=7.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.urls]
Homepage = "https://github.com/fastauth/fastauth"
Documentation = "https://github.com/fastauth/fastauth#readme"
Repository = "https://github.com/fastauth/fastauth"
Issues = "https://github.com/fastauth/fastauth/issues"
Changelog = "https://github.com/fastauth/fastauth/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fastauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "B008", "N818", "B009", "UP006", "UP035", "UP045", "TC006"]

[tool.ruff.lint.isort]
known-first-party = ["fastauth"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "fastapi.*", "starlette.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["fastauth"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
